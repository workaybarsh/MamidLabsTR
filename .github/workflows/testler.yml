name: Testler

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testler:
    name: Windows · Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: python -m pip install pytest -r requirements/app.txt

      - name: Testleri calistir
        run: python -m pytest -q -rs
